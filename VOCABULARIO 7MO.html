<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juego de vocabulario: sinónimos</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#23303b;--mu:#66717b;--ac:#2f6f8f;--ok:#2e8b57;--okbg:#e3f4ea;--ko:#c0392b;--kobg:#fbe6e3;--bd:#dcd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b1f;--card:#222830;--tx:#eceff2;--mu:#9aa5af;--ac:#6bb6d6;--ok:#5cc48a;--okbg:#1e3a2b;--ko:#ef7b6e;--kobg:#412522;--bd:#38414a}}
:root[data-theme="dark"]{--bg:#171b1f;--card:#222830;--tx:#eceff2;--mu:#9aa5af;--ac:#6bb6d6;--ok:#5cc48a;--okbg:#1e3a2b;--ko:#ef7b6e;--kobg:#412522;--bd:#38414a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:560px}
h1{font-size:1.3rem;margin:0 0 4px;text-align:center}
.sub{color:var(--mu);text-align:center;font-size:.9rem;margin-bottom:16px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.q{font-size:1rem;color:var(--mu);margin:0 0 6px}
.word{font-size:2rem;font-weight:800;letter-spacing:.04em;color:var(--ac);margin:0 0 18px;text-align:center}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:1.05rem;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--bd);align-items:center;justify-content:center;font-size:.85rem;flex:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.opt:disabled{cursor:default}
.fb{min-height:24px;margin:4px 0 12px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.end{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--ac);margin:6px 0}
.rev{text-align:left;margin:16px 0;font-size:.95rem}
.rev div{padding:8px 0;border-top:1px solid var(--bd)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>📚 Desafío de vocabulario</h1>
<div class="sub">Elige la palabra que puede reemplazar a la palabra destacada</div>
<div id="game">
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="num"></span><span id="pts"></span></div>
  <div class="card">
    <p class="q">¿Por cuál de las siguientes palabras se puede reemplazar…?</p>
    <p class="word" id="word"></p>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next" disabled>Siguiente</button>
  </div>
</div>
<div id="end" class="card end hide">
  <div style="font-size:2.4rem" id="emoji">🏆</div>
  <div class="score" id="final"></div>
  <div id="msg"></div>
  <div class="rev" id="rev"></div>
  <button class="btn" id="again">Jugar de nuevo</button>
</div>
</main>
<script>
const Q=[
{w:"COMPUNGIDA",o:["Apesadumbrada","Entusiasmada","Indiferente","Orgullosa"],c:0},
{w:"EMBELESADO",o:["Distraído","Cautivado","Aburrido","Molesto"],c:1},
{w:"INCREPAR",o:["Amonestar","Felicitar","Elogiar","Ignorar"],c:0},
{w:"HORTERA",o:["Distinguido","Chabacano","Refinado","Discreto"],c:1},
{w:"PEDANTE",o:["Humilde","Modesto","Sabiondo","Tímido"],c:2},
{w:"DESASTRADO",o:["Harapiento","Impecable","Arreglado","Elegante"],c:0},
{w:"DESVALIDA",o:["Acompañada","Fortalecida","Protegida","Indefensa"],c:3}
];
const L="ABCD",P=2;
let i,score,log,done;
const $=id=>document.getElementById(id);
function start(){i=0;score=0;log=[];$("game").classList.remove("hide");$("end").classList.add("hide");show()}
function show(){
  done=false;const q=Q[i];
  $("num").textContent="Pregunta "+(i+1)+" de "+Q.length;
  $("pts").textContent="Puntaje: "+score+" / "+Q.length*P;
  $("bar").style.width=(i/Q.length*100)+"%";
  $("word").textContent=q.w;
  $("fb").textContent="";$("fb").className="fb";
  $("next").disabled=true;
  $("next").textContent=i===Q.length-1?"Ver resultado":"Siguiente";
  const box=$("opts");box.innerHTML="";
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+L[k]+"</b><span>"+t+"</span>";
    b.onclick=()=>pick(k);box.appendChild(b);
  });
}
function pick(k){
  if(done)return;done=true;
  const q=Q[i],bs=[...$("opts").children];
  bs.forEach(b=>b.disabled=true);
  bs[q.c].classList.add("ok");
  const good=k===q.c;
  if(good){score+=P;$("fb").textContent="¡Correcto! +"+P+" puntos";$("fb").classList.add("ok")}
  else{bs[k].classList.add("ko");$("fb").textContent="Incorrecto. La respuesta era "+L[q.c]+") "+q.o[q.c];$("fb").classList.add("ko")}
  log.push({w:q.w,good:good,r:q.o[q.c],e:q.o[k]});
  $("pts").textContent="Puntaje: "+score+" / "+Q.length*P;
  $("next").disabled=false;
}
function finish(){
  $("game").classList.add("hide");$("end").classList.remove("hide");
  const max=Q.length*P,pct=score/max;
  $("final").textContent=score+" / "+max+" puntos";
  $("emoji").textContent=pct>=.85?"🏆":pct>=.6?"👏":"💪";
  $("msg").textContent=pct>=.85?"¡Excelente dominio del vocabulario!":pct>=.6?"¡Buen trabajo! Repasa las que fallaste.":"¡Sigue practicando, tú puedes!";
  $("rev").innerHTML=log.map(l=>"<div>"+(l.good?"✅":"❌")+" <b>"+l.w+"</b> → "+l.r+(l.good?"":" <span style='color:var(--mu)'>(marcaste: "+l.e+")</span>")+"</div>").join("");
}
$("next").onclick=()=>{if(!done)return;i++;i<Q.length?show():finish()};
$("again").onclick=start;
start();
</script>
</body>
</html>
